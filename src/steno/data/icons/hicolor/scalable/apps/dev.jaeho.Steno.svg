<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Brand tile. Rounded square, brand teal. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#118a7a"/>
  <!-- One bold microphone. No fine note rules: at 14px they grey out into noise
       and the icon reads as a broken tile. Two short bars only, stroke as thick
       as the mic, so the notes cue survives the shrink. -->
  <g fill="#f4f7f7">
    <rect x="34" y="22" width="30" height="52" rx="15"/>
    <rect x="44" y="82" width="10" height="16" rx="5"/>
  </g>
  <path d="M24 58a25 25 0 0 0 50 0" fill="none" stroke="#f4f7f7"
        stroke-width="12" stroke-linecap="round"/>
  <g stroke="#f4f7f7" stroke-width="12" stroke-linecap="round">
    <path d="M90 42h14"/>
    <path d="M90 72h14"/>
  </g>
</svg>
