[project]
name = "steno"
version = "0.4.0"
description = "Listens to your meetings, keeps up when you drift, and turns them into notes and todos"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "websockets>=13.0",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Only `steno clean-echo` needs it, and only for meetings recorded before the
# PipeWire canceller was installed. Imported where it is used, so the rest of
# the tool runs without it.
clean = ["numpy>=1.24"]

[project.scripts]
steno = "steno.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[dependency-groups]
dev = [
    "pygobject-stubs>=2.17.0",
]
