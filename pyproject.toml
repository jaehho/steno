[project]
name = "meeting-copilot"
version = "0.1.0"
description = "Live meeting copilot: dual audio capture -> Deepgram -> Claude advisor TUI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "websockets>=13.0",
    "textual>=0.86.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
copilot = "copilot:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["copilot"]
