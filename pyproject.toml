[project]
name = "steno"
version = "0.11.0"
description = "Listens to your meetings, keeps up when you drift, and turns them into notes and todos"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Only `steno clean-echo` needs it, and only for meetings recorded before the
# PipeWire canceller was installed. Imported where it is used, so the rest of
# the tool runs without it.
clean = ["numpy>=1.24"]

[project.scripts]
steno = "steno.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
steno = ["data/icons/hicolor/*/*/*.svg", "data/icons/hicolor/index.theme"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "C4",
  "SIM", "RUF", "PERF", "PIE", "RET", "RSE",
  "ARG", "PTH", "FLY", "PL", "TRY", "T20", "T10",
]
ignore = [
  "E501",
  "COM812", "COM819", "ISC001",
  "S101",
]

[tool.ruff.lint.per-file-ignores]
# CLI entry: print is the interface
"src/steno/cli.py" = ["T201", "T203"]

[dependency-groups]
dev = [
    "pygobject-stubs>=2.17.0",
]
